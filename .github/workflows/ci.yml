name: CI

on:
  push:
    branches: ["E&E"]
  pull_request:
    branches: ["E&E"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Serial analysis tools (no MPI): ctt, mat, pet, urpu via their CMake builds.
  # (mat MAT_TARGET=openmp is not functional yet, so it is not built.)
  tools:
    name: ctt + mat + pet + urpu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build zlib1g-dev
      - name: Build ctt
        run: |
          cmake -S mpi.tool/components/ctt/src -B build/ctt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ctt && cmake --install build/ctt
      - name: Build mat (serial)
        run: |
          cmake -S mpi.tool/components/mat/src -B build/mat -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial
          cmake --build build/mat && cmake --install build/mat
      - name: Build pet
        run: |
          cmake -S mpi.tool/components/pet/src -B build/pet -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pet && cmake --install build/pet
      - name: Build urpu (serial)
        run: |
          cmake -S mpi.tool/components/urpu/src -B build/urpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DURPU_TARGET=serial
          cmake --build build/urpu && cmake --install build/urpu
      - name: Build ctt + mat + pet + urpu (GNU make)
        # the Makefiles too, not only CMake (in-tree objects; the CMake builds above are out of tree)
        run: |
          for c in ctt pet; do make -C mpi.tool/components/$c/src -j"$(nproc)"; done
          for c in mat urpu; do make -C mpi.tool/components/$c/src -j"$(nproc)" TARGET=serial; done
      - name: Build mat without MAT_INDEXED_COLLECTIVES (CMake + GNU make, serial)
        # the old collective matching must still build with both; the smoke tests compare its output with the default
        run: |
          cmake -S mpi.tool/components/mat/src -B build/mat-walk -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial \
            -DMAT_INDEXED_COLLECTIVES=OFF
          ! grep -q -- '-DMAT_INDEXED_COLLECTIVES' build/mat-walk/build.ninja || { echo "::error::MAT_INDEXED_COLLECTIVES=OFF still defines it"; exit 1; }
          grep -q -- '-DMAT_INDEXED_COLLECTIVES' build/mat/build.ninja || { echo "::error::default mat build does not define MAT_INDEXED_COLLECTIVES"; exit 1; }
          cmake --build build/mat-walk
          make -C mpi.tool/components/mat/src clean TARGET=serial
          make -C mpi.tool/components/mat/src -j"$(nproc)" TARGET=serial MAT_INDEXED_COLLECTIVES=off
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: mpi.tool/bin/

  # Trace collector via CMake, then an end-to-end smoke test (tests/ci/smoke.sh: func-classes tests
  # under tractor -> mat -> ctt).
  # Ubuntu 24.04's MPICH 4.2 is built --with-pmix, but its hydra mpiexec only serves PMI-1, so every
  # "mpiexec -n 4" starts 4 singletons: that MPICH is only build-tested (it is the MPI 4.1 non-const
  # prototype case). Smoke tests run on 22.04's MPICH 4.0 (plain PMI) and on MPICH built from source.
  #
  # Source-built MPIs (src/ver/dev) come from tests/ci/build_mpi.sh and are cached in .ci-mpi/. Entries with "patch"
  # are the engineering builds: every mpi.tool/patches/<patch>/*.patch is applied (MPICH family: then autogen.sh)
  # and tractor is built with the MPI-internal parsing on (CMake BUILD_TRACTOR_ENGINEERING_VERSION=on, make
  # PARSE_MPI_INTERNAL=on). Their cache key contains the hash of the patch files, so the MPI is patched and rebuilt
  # only when a patch changes or there is no cached build yet; otherwise the cached MPI is used and only the tools
  # are rebuilt and smoke-tested.
  #
  # Entries with "pmat" (stock: mpich-4.3.2 and openmpi-5.0.11; engineering: mpich-4.3.2-eng, mpich-5.0.2-eng,
  # mvapich-4.1-eng (MPICH-derived: MAT_TARGET mpich) and openmpi-5.0.11-eng, on traces with MPI-internal functions) also build parallel mat (pmat.<pmat>, mat's CMake
  # MAT_TARGET) with that job's MPI, and the smoke test runs it on every trace with 1, 2 and 4 ranks, each in its own copy of
  # the trace, and compares its output with serial mat's. pmat is experimental: a failure or mismatch shows up as a
  # warning annotation (details in the step log and the smoke artifacts) but does not fail the job.
  tractor:
    name: tractor (${{ matrix.mpi }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, mpi: mpich-4.0,   mpi_pkg: libmpich-dev mpich, target: mpich4, diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-4.3.2, src: mpich, ver: "4.3.2", dev: "ch4:ofi",  target: mpich4, diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma", pmat: mpich }
          - { os: ubuntu-24.04, mpi: mpich-5.0.2, src: mpich, ver: "5.0.2", dev: "ch4:ofi",  target: mpich5, diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma" }
          # latest MPICH 3 (MPI 3.1): tractor's mpich3 target (MPICH 3 MPI-internal helper signatures)
          - { os: ubuntu-24.04, mpi: mpich-3.4.3, src: mpich, ver: "3.4.3", dev: "ch3:sock", target: mpich3, diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-4.2,   mpi_pkg: libmpich-dev mpich, target: mpich4, diags: "OFF", smoke: false }
          # Ubuntu 24.04 ships Open MPI 4.1; rma hangs under Open MPI even without tractor, so it is left out.
          - { os: ubuntu-24.04, mpi: openmpi-4.1, mpi_pkg: libopenmpi-dev openmpi-bin, target: openmpi, make_target: openmpi5, diags: "OFF", smoke: true, smoke_tests: "p2p coll comm", experimental: true }
          # Open MPI 5 built from source (as tractor's Open MPI target expects); rma hangs under Open MPI 5
          # even without tractor, so it is left out.
          - { os: ubuntu-24.04, mpi: openmpi-5.0.10, src: openmpi, ver: "5.0.10", target: openmpi, make_target: openmpi5, diags: "OFF", smoke: true, smoke_tests: "p2p coll comm" }
          # 5.0.11 fixes the restarted MPI_Bsend_init bug, so p2p_test checks it strictly there
          - { os: ubuntu-24.04, mpi: openmpi-5.0.11, src: openmpi, ver: "5.0.11", target: openmpi, make_target: openmpi5, diags: "OFF", smoke: true, smoke_tests: "p2p coll comm", pmat: ompi }
          # engineering (patched) MPIs: one entry per mpi.tool/patches directory, except the deprecated mpich-5.0.1
          # (superseded by 5.0.2) and mvapich-2.3.5 (superseded by 2.3.7-1)
          - { os: ubuntu-24.04, mpi: mpich-3.4.3-eng,    src: mpich,    ver: "3.4.3",   dev: "ch3:sock", patch: mpich-3.4.3,     target: mpich3,   diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-4.3.2-eng,    src: mpich,    ver: "4.3.2",   dev: "ch4:ofi",  patch: mpich-4.3.2,     target: mpich4,   diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma", pmat: mpich }
          - { os: ubuntu-24.04, mpi: mpich-5.0.2-eng,    src: mpich,    ver: "5.0.2",   dev: "ch4:ofi",  patch: mpich-5.0.2,     target: mpich5,   diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma", pmat: mpich }
          # MVAPICH 4.1 itself (stock too, without tractor) hangs in MPI_Dist_graph_create (comm) and fails a persistent
          # collective's Waitall (coll), so those two are left out; it runs on libfabric's shm provider (mvapich-4.1.shm.patch)
          # (its embedded libfabric's ucr provider includes <infiniband/ib.h>: verbs headers needed to build)
          - { os: ubuntu-24.04, mpi: mvapich-4.1-eng,    src: mvapich,  ver: "4.1",     dev: "ch4:ofi",  patch: mvapich-4.1,     target: mvapich4, diags: "OFF ON", smoke: true, smoke_tests: "p2p rma", fi_provider: shm, mpi_pkg: libibverbs-dev librdmacm-dev, pmat: mpich }
          # MVAPICH2 on its PSM2 device (ch3:psm, libpsm2 12.0.1 built from source by tests/ci/build_psm2.sh - Ubuntu's 11.2
          # fails psm2_init without an HFI even shm-only): runs on one node without an Omni-Path HFI with
          # PSM2_DEVICES=self,shm (set in the smoke step, as is MV2_USE_SHMEM_COLL=0); the verbs headers are still
          # needed for the transport patch's verbs proxy
          - { os: ubuntu-24.04, mpi: mvapich2-2.3.7-1-eng, src: mvapich2, ver: "2.3.7-1", dev: "ch3:psm", patch: mvapich-2.3.7-1, target: mvapich2, diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma", psm2: "12.0.1", mpi_pkg: libnuma-dev libibverbs-dev librdmacm-dev libibumad-dev }
          - { os: ubuntu-24.04, mpi: openmpi-5.0.10-eng, src: openmpi,  ver: "5.0.10",                   patch: openmpi-5.0.10,  target: openmpi,  make_target: openmpi5, diags: "OFF", smoke: true, smoke_tests: "p2p coll comm" }
          - { os: ubuntu-24.04, mpi: openmpi-5.0.11-eng, src: openmpi,  ver: "5.0.11",                   patch: openmpi-5.0.11,  target: openmpi,  make_target: openmpi5, diags: "OFF", smoke: true, smoke_tests: "p2p coll comm", pmat: ompi }
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      # inside the workspace: actions/cache rejects paths with a '..' segment (and then silently saves nothing)
      MPI_PREFIX: ${{ github.workspace }}/.ci-mpi/${{ matrix.src }}-${{ matrix.ver }}${{ matrix.patch && '-eng' || '' }}
      PSM2_PREFIX: ${{ github.workspace }}/.ci-mpi/psm2-${{ matrix.psm2 }}
      # engineering tractor: lib name suffix of the GNU make build (CMake keeps the plain name)
      ENG_SUFFIX: ${{ matrix.patch && '.eng' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gfortran cmake ninja-build perl libswitch-perl \
            zlib1g-dev libhwloc-dev libunwind-dev libomp-dev ${{ matrix.mpi_pkg }} \
            ${{ matrix.patch && 'autoconf automake libtool m4 python3' || '' }}
      - name: Cache PSM2 ${{ matrix.psm2 }}
        if: matrix.psm2
        id: psm2-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PSM2_PREFIX }}
          key: psm2-${{ matrix.psm2 }}-gnu-${{ matrix.os }}-v1
      - name: Build PSM2 ${{ matrix.psm2 }} from source
        if: matrix.psm2 && steps.psm2-cache.outputs.cache-hit != 'true'
        run: mpi.tool/components/tractor/tests/ci/build_psm2.sh ${{ matrix.psm2 }} "$PSM2_PREFIX"
      - name: Use PSM2 ${{ matrix.psm2 }}
        if: matrix.psm2
        run: echo "PSM2PATH=$PSM2_PREFIX/usr" >> "$GITHUB_ENV"
      - name: Cache ${{ matrix.mpi }}
        if: matrix.src
        id: mpi-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.MPI_PREFIX }}
          # stock: <src>-<ver>-<dev|internal>-gnu-<os>-v1; engineering: + -eng-<hash of the patch files>
          key: >-
            ${{ matrix.src }}-${{ matrix.ver }}-${{ matrix.dev || 'internal' }}-gnu-${{ matrix.os }}-v1${{
            matrix.patch && '-eng-' || '' }}${{
            matrix.patch && hashFiles(format('mpi.tool/patches/{0}/*.patch', matrix.patch || 'none')) || '' }}${{
            matrix.psm2 && format('-psm2-{0}', matrix.psm2) || '' }}
      - name: Build ${{ matrix.mpi }} from source${{ matrix.patch && ' (apply patches)' || '' }}
        if: matrix.src && steps.mpi-cache.outputs.cache-hit != 'true'
        run: |
          mpi.tool/components/tractor/tests/ci/build_mpi.sh ${{ matrix.src }} ${{ matrix.ver }} "$MPI_PREFIX" \
            "${{ matrix.dev }}" ${{ matrix.patch && format('mpi.tool/patches/{0}', matrix.patch) || '' }}
      - name: Use ${{ matrix.mpi }}
        if: matrix.src
        run: |
          echo "$MPI_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$MPI_PREFIX/lib${{ matrix.psm2 && ':$PSM2_PREFIX/usr/lib64' || '' }}" >> "$GITHUB_ENV"
      - name: Check the MPI is patched
        if: matrix.patch
        # every hook patch exports mpi_internal_comm_create; a stock libmpi never defines it
        run: |
          nm -D --defined-only "$MPI_PREFIX"/lib/libmpi.so | grep -w mpi_internal_comm_create \
            || { echo "::error::$MPI_PREFIX/lib/libmpi.so is not patched"; exit 1; }
      - name: Show MPI
        run: |
          which mpicc mpicxx mpiexec
          mpicxx -show
          mpiexec --version 2>/dev/null | head -5 || true
      - name: Provide omp-tools.h (OMPT=ON)
        # GCC's libgomp has no omp-tools.h; take only that header from LLVM's OpenMP so clang's other
        # headers (stddef.h, ...) don't end up on gcc's include path.
        run: |
          hdr=$(find /usr/lib/llvm-* /usr/include -name omp-tools.h 2>/dev/null | head -1)
          [ -n "$hdr" ] || { echo "omp-tools.h not found"; exit 1; }
          echo "using $hdr"
          mkdir -p "$RUNNER_TEMP/ompt" && cp "$hdr" "$RUNNER_TEMP/ompt/"
          echo "CPATH=$RUNNER_TEMP/ompt" >> "$GITHUB_ENV"
      - name: Build tractor (DIAG = ${{ matrix.diags }})
        # every DIAG variant in this one job: they share the deps install and the MPI build/cache
        run: |
          for d in ${{ matrix.diags }}; do
            b=build/tractor-$d
            cmake -S mpi.tool/components/tractor/src -B $b -G Ninja \
              -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx \
              -DTRACTOR_TARGET=${{ matrix.target }} -DDIAG=$d \
              -DBUILD_TRACTOR_ENGINEERING_VERSION=${{ matrix.patch && 'on' || 'auto' }}
            cmake --build $b
            cmake --install $b
          done
          ldd mpi.tool/lib/gnu/libtractor*.so
      - name: Build tractor with GNU make (DIAG = ${{ matrix.diags }})
        # the Makefile builds in the source tree and installs to the same mpi.tool/lib/gnu names as CMake,
        # so its libraries are only copied aside (make clean between the variants would delete them)
        working-directory: mpi.tool/components/tractor/src
        env:
          MPICC: mpicc
          MPICXX: mpicxx
          MPIFC: mpif90
          HWLOC_PATH: /usr
        run: |
          t=${{ matrix.make_target || matrix.target }}
          eng=PARSE_MPI_INTERNAL=${{ matrix.patch && 'on' || 'off' }}
          mkdir -p "$RUNNER_TEMP/make-lib"
          for d in ${{ matrix.diags }}; do
            d=${d,,}
            make clean COMPILER=gnu TARGET=$t DIAG=$d $eng > /dev/null
            make -j"$(nproc)" all COMPILER=gnu TARGET=$t DIAG=$d $eng
            cp -v libtractor*.$t$ENG_SUFFIX.so.[0-9]*.[0-9]* "$RUNNER_TEMP/make-lib/"
          done
          ldd "$RUNNER_TEMP"/make-lib/libtractor*.so.*
      - name: Build mat + ctt (for smoke test)
        if: matrix.smoke
        run: |
          cmake -S mpi.tool/components/ctt/src -B build/ctt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ctt && cmake --install build/ctt
          cmake -S mpi.tool/components/mat/src -B build/mat -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build build/mat && cmake --install build/mat
          # the same without MAT_INDEXED_COLLECTIVES (old collective matching), not installed: the smoke test runs it
          # next to the default mat and requires identical output (SMOKE_MAT_ALT)
          cmake -S mpi.tool/components/mat/src -B build/mat-walk -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial \
            -DCMAKE_CXX_COMPILER=g++ -DMAT_INDEXED_COLLECTIVES=OFF
          cmake --build build/mat-walk
      - name: Build parallel mat (pmat.${{ matrix.pmat }}, experimental)
        if: matrix.smoke && matrix.pmat
        id: pmat
        continue-on-error: true
        run: |
          cmake -S mpi.tool/components/mat/src -B build/pmat -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMAT_TARGET=${{ matrix.pmat }} -DCMAKE_CXX_COMPILER=mpicxx
          # an MPI target must compile with PEAT_MPI: without it the binary is serial mat under another name
          grep -q -- '-DPEAT_MPI' build/pmat/build.ninja || { echo "::error::pmat is not built with PEAT_MPI"; exit 1; }
          cmake --build build/pmat && cmake --install build/pmat
          ldd mpi.tool/bin/pmat.${{ matrix.pmat }} | grep -E "libmpi|not found"
      - name: Smoke test (tests under tractor -> mat -> ctt)
        if: matrix.smoke
        env:
          MPICC: mpicc
          FI_PROVIDER: ${{ matrix.fi_provider || 'tcp' }} # libfabric (ch4:ofi): tcp works on a plain VM
          PSM2_DEVICES: self,shm  # MVAPICH2 ch3:psm without an Omni-Path HFI (other MPIs ignore it)
          PSM2_KASSIST_MODE: none # PSM2 shm: no cross-memory attach (CMA) - the runner forbids process_vm_readv between the
                                  # ranks, and PSM2 12.0.1 asserts instead of falling back when a CMA read fails
          MV2_USE_SHMEM_COLL: 0   # MVAPICH2: no shared-memory collectives (and their 2-level comms)
          MV2_ENABLE_AFFINITY: 0  # MVAPICH2: no CPU binding - on the runner VM its implicit mapping picks cores that do not
                                  # exist ("Core id 33 does not exist", MPI_Init fails); a single-node smoke test needs none
          SMOKE_ENGINEERING: ${{ matrix.patch && '1' || '0' }} # engineering build: MPI-internal functions must be traced
          # serial mat without MAT_INDEXED_COLLECTIVES on every trace too: output must be identical to the default mat's
          SMOKE_MAT_ALT: build/mat-walk/mat
          # also run pmat on the traces (experimental: reported, not counted), if it built
          SMOKE_PMAT: ${{ steps.pmat.outcome == 'success' && format('mpi.tool/bin/pmat.{0}', matrix.pmat) || '' }}
          SMOKE_PMAT_RANKS: 1 2 4
        run: |
          status=0
          for b in cmake make; do
            for d in ${{ matrix.diags }}; do
              case $d in [Oo][Nn]) dbg=_dbg ;; *) dbg= ;; esac
              if [ $b = cmake ]; then lib=mpi.tool/lib/gnu/libtractor$dbg.${{ matrix.target }}.so
              else lib=$(ls "$RUNNER_TEMP"/make-lib/libtractor$dbg.${{ matrix.make_target || matrix.target }}$ENG_SUFFIX.so.* | head -1); fi
              echo "::group::smoke $b DIAG=$d ($lib)"
              SMOKE_WORKDIR=$RUNNER_TEMP/smoke-$b-diag-$d \
                mpi.tool/components/tractor/tests/ci/smoke.sh "$lib" 4 3 "${{ matrix.smoke_tests }}" || { status=1; echo "::error::smoke $b DIAG=$d failed"; }
              echo "::endgroup::"
            done
          done
          exit $status
      - name: Upload smoke logs and traces
        if: always() && matrix.smoke
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.mpi }}
          path: ${{ runner.temp }}/smoke-*-diag-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: tractor-${{ matrix.mpi }}
          path: |
            mpi.tool/lib/gnu/
            mpi.tool/bin/gnu/

  # Qt trace viewer.
  qtv:
    name: qTV (Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build zlib1g-dev \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev libgl-dev
      - name: Configure and build
        working-directory: mpi.tool/components/qTV
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/../../.."
          cmake --build build
          cmake --install build
