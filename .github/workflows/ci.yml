name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Serial analysis tools: no MPI needed. (mat TARGET=openmp is not functional yet, so it is not built.)
  tools:
    name: ctt + mat
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ make zlib1g-dev
      - name: Build ctt
        working-directory: mpi.tool/components/ctt/src
        run: make -j"$(nproc)" && make install
      - name: Build mat
        working-directory: mpi.tool/components/mat/src
        run: make -j"$(nproc)" TARGET=serial && make install TARGET=serial
      - uses: actions/upload-artifact@v7
        with:
          name: tools
          path: mpi.tool/bin/

  # Trace collector, built against distro MPIs. Calls make directly instead of
  # Build.sh/env.sh, because those expect MPIs installed under $HOME/<mpi>/<ver>.
  # Ubuntu 24.04's MPICH 4.2 is built --with-pmix, but its hydra mpiexec only serves PMI-1, so every
  # "mpiexec -n 4" starts 4 singletons: that MPICH is only build-tested (it is the MPI 4.1 non-const
  # prototype case). Smoke tests run on 22.04's MPICH 4.0 (plain PMI) and on MPICH built from source.
  tractor:
    name: tractor (${{ matrix.mpi }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, mpi: mpich-4.0,   mpi_pkg: libmpich-dev mpich, target: mpich4, diags: "off on", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-4.3.2, src: mpich, ver: "4.3.2", dev: "ch4:ofi",           target: mpich4, diags: "off on", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-5.0.2, src: mpich, ver: "5.0.2", dev: "ch4:ofi",           target: mpich5, diags: "off on", smoke: true, smoke_tests: "p2p coll comm rma" }
          # latest MPICH 3 (MPI 3.1): tractor's mpich3 target
          - { os: ubuntu-24.04, mpi: mpich-3.4.3, src: mpich, ver: "3.4.3", dev: "ch3:sock",           target: mpich3, diags: "off on", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-4.2,   mpi_pkg: libmpich-dev mpich, target: mpich4, diags: "off", smoke: false }
          # Ubuntu 24.04 ships Open MPI 4.1; tractor's openmpi5 target expects 5.x.
          # rma_test hangs under Open MPI 5 even without tractor, so it is left out here.
          - { os: ubuntu-24.04, mpi: openmpi-4.1, mpi_pkg: libopenmpi-dev openmpi-bin, target: openmpi5, diags: "off", smoke: true, smoke_tests: "p2p coll comm", experimental: true }
          # Open MPI 5 built from source (as tractor's Open MPI target expects); rma hangs under Open MPI 5
          # even without tractor, so it is left out.
          - { os: ubuntu-24.04, mpi: openmpi-5.0.10, src: openmpi, ver: "5.0.10", target: openmpi5, diags: "off", smoke: true, smoke_tests: "p2p coll comm" }
          # 5.0.11 fixes the restarted MPI_Bsend_init bug, so p2p_test checks it strictly there
          - { os: ubuntu-24.04, mpi: openmpi-5.0.11, src: openmpi, ver: "5.0.11", target: openmpi5, diags: "off", smoke: true, smoke_tests: "p2p coll comm" }
          # engineering (patched) MPIs: one entry per mpi.tool/patches directory, except the deprecated mpich-5.0.1
          # (superseded by 5.0.2) and mvapich-2.3.5 (superseded by 2.3.7-1). Every <patch>/*.patch is applied (MPICH family: then autogen.sh) and tractor is built
          # with PARSE_MPI_INTERNAL=on; the cache key holds the hash of the patch files, so the MPI is rebuilt only when
          # a patch changes (or there is no cached build yet).
          - { os: ubuntu-24.04, mpi: mpich-4.3.2-eng, src: mpich,   ver: "4.3.2", dev: "ch4:ofi", patch: mpich-4.3.2,   target: mpich4,   diags: "off on", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-5.0.2-eng, src: mpich,   ver: "5.0.2", dev: "ch4:ofi", patch: mpich-5.0.2,   target: mpich5,   diags: "off on", smoke: true, smoke_tests: "p2p coll comm rma" }
          # MVAPICH 4.1 itself (stock too, without tractor) hangs in MPI_Dist_graph_create (comm) and fails a persistent
          # collective's Waitall (coll), so those two are left out; it runs on libfabric's shm provider (mvapich-4.1.shm.patch)
          # (its embedded libfabric's ucr provider includes <infiniband/ib.h>: verbs headers needed to build)
          - { os: ubuntu-24.04, mpi: mvapich-4.1-eng, src: mvapich, ver: "4.1",   dev: "ch4:ofi", patch: mvapich-4.1,   target: mvapich4, diags: "off on", smoke: true, smoke_tests: "p2p rma", fi_provider: shm, mpi_pkg: libibverbs-dev librdmacm-dev }
          # MVAPICH2 on its PSM2 device (ch3:psm, libpsm2 12.0.1 built from source by tests/ci/build_psm2.sh - Ubuntu's 11.2
          # fails psm2_init without an HFI even shm-only): runs on one node without an Omni-Path HFI with
          # PSM2_DEVICES=self,shm (set in the smoke step, as is MV2_USE_SHMEM_COLL=0); the verbs headers are still needed.
          # rma is experimental here: with this branch's tractor it intermittently segfaults in MVAPICH2's psm_1sided_input
          # during MPI_Win_flush_local_all (~1 run in 16; never without tractor, never with the E&E branch's tractor)
          - { os: ubuntu-24.04, mpi: mvapich2-2.3.7-1-eng, src: mvapich2, ver: "2.3.7-1", dev: "ch3:psm", patch: mvapich-2.3.7-1, target: mvapich2, diags: "off on", smoke: true, smoke_tests: "p2p coll comm", smoke_experimental: "rma", psm2: "12.0.1", mpi_pkg: libnuma-dev libibverbs-dev librdmacm-dev libibumad-dev }
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      # inside the workspace: actions/cache rejects paths with a '..' segment (and then silently saves nothing)
      MPI_PREFIX: ${{ github.workspace }}/.ci-mpi/${{ matrix.src }}-${{ matrix.ver }}${{ matrix.patch && '-eng' || '' }}
      PSM2_PREFIX: ${{ github.workspace }}/.ci-mpi/psm2-${{ matrix.psm2 }}
      # engineering tractor: lib name suffix of the GNU make build
      ENG_SUFFIX: ${{ matrix.patch && '.eng' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make perl libswitch-perl zlib1g-dev libhwloc-dev libunwind-dev libomp-dev ${{ matrix.mpi_pkg }} \
            ${{ matrix.patch && 'autoconf automake libtool m4 python3' || '' }}
      - name: Cache PSM2 ${{ matrix.psm2 }}
        if: matrix.psm2
        id: psm2-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.PSM2_PREFIX }}
          key: psm2-${{ matrix.psm2 }}-gnu-${{ matrix.os }}-v1
      - name: Build PSM2 ${{ matrix.psm2 }} from source
        if: matrix.psm2 && steps.psm2-cache.outputs.cache-hit != 'true'
        run: mpi.tool/components/tractor/tests/ci/build_psm2.sh ${{ matrix.psm2 }} "$PSM2_PREFIX"
      - name: Use PSM2 ${{ matrix.psm2 }}
        if: matrix.psm2
        run: echo "PSM2PATH=$PSM2_PREFIX/usr" >> "$GITHUB_ENV"
      - name: Cache ${{ matrix.mpi }}
        if: matrix.src
        id: mpi-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.MPI_PREFIX }}
          # stock: <src>-<ver>-<dev|internal>-gnu-<os>-v1 (unchanged); engineering: + -eng-<hash of the patch files>
          key: >-
            ${{ matrix.src }}-${{ matrix.ver }}-${{ matrix.dev || 'internal' }}-gnu-${{ matrix.os }}-v1${{
            matrix.patch && '-eng-' || '' }}${{
            matrix.patch && hashFiles(format('mpi.tool/patches/{0}/*.patch', matrix.patch || 'none')) || '' }}${{
            matrix.psm2 && format('-psm2-{0}', matrix.psm2) || '' }}
      - name: Build ${{ matrix.mpi }} from source${{ matrix.patch && ' (apply patches)' || '' }}
        if: matrix.src && steps.mpi-cache.outputs.cache-hit != 'true'
        # tests/ci/build_mpi.sh: MPICH ch4:ofi (embedded libfabric) / ch3:sock, MVAPICH, MVAPICH2, Open MPI (bundled
        # hwloc/libevent/PMIx/PRRTE), no Fortran; with a patch dir every *.patch is applied first
        run: |
          mpi.tool/components/tractor/tests/ci/build_mpi.sh ${{ matrix.src }} ${{ matrix.ver }} "$MPI_PREFIX" \
            "${{ matrix.dev }}" ${{ matrix.patch && format('mpi.tool/patches/{0}', matrix.patch) || '' }}
      - name: Use ${{ matrix.mpi }}
        if: matrix.src
        run: |
          echo "$MPI_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$MPI_PREFIX/lib${{ matrix.psm2 && ':$PSM2_PREFIX/usr/lib64' || '' }}" >> "$GITHUB_ENV"
      - name: Check the MPI is patched
        if: matrix.patch
        # every hook patch exports mpi_internal_comm_create; a stock libmpi never defines it
        run: |
          nm -D --defined-only "$MPI_PREFIX"/lib/libmpi.so | grep -w mpi_internal_comm_create \
            || { echo "::error::$MPI_PREFIX/lib/libmpi.so is not patched"; exit 1; }
      - name: Show MPI
        run: |
          which mpicc mpicxx mpiexec
          mpicxx -show
          mpiexec --version 2>/dev/null | head -5 || true
      - name: Provide omp-tools.h (OMPT=on)
        # GCC's libgomp has no omp-tools.h; take only that header from LLVM's OpenMP so clang's other
        # headers (stddef.h, ...) don't end up on gcc's include path.
        run: |
          hdr=$(find /usr/lib/llvm-* /usr/include -name omp-tools.h 2>/dev/null | head -1)
          [ -n "$hdr" ] || { echo "omp-tools.h not found"; exit 1; }
          echo "using $hdr"
          mkdir -p "$RUNNER_TEMP/ompt" && cp "$hdr" "$RUNNER_TEMP/ompt/"
          echo "CPATH=$RUNNER_TEMP/ompt" >> "$GITHUB_ENV"
      - name: Build tractor (DIAG = ${{ matrix.diags }})
        # every DIAG variant in this one job: they share the deps install and the MPI build/cache
        # (the Makefile builds in the source tree, so clean between the variants)
        working-directory: mpi.tool/components/tractor/src
        env:
          MPICC: mpicc
          MPICXX: mpicxx
          MPIFC: mpif90
          HWLOC_PATH: /usr
        run: |
          eng=PARSE_MPI_INTERNAL=${{ matrix.patch && 'on' || 'off' }}
          for d in ${{ matrix.diags }}; do
            make clean COMPILER=gnu TARGET=${{ matrix.target }} DIAG=$d $eng > /dev/null
            make -j"$(nproc)" all     COMPILER=gnu TARGET=${{ matrix.target }} DIAG=$d $eng
            make              install COMPILER=gnu TARGET=${{ matrix.target }} DIAG=$d $eng
          done
          ldd ../../../lib/gnu/libtractor*.so
      - name: Build mat + ctt (for smoke test)
        if: matrix.smoke
        run: |
          make -C mpi.tool/components/ctt/src -j"$(nproc)" && make -C mpi.tool/components/ctt/src install
          make -C mpi.tool/components/mat/src -j"$(nproc)" TARGET=serial && make -C mpi.tool/components/mat/src install TARGET=serial
      - name: Smoke test (tests under tractor -> mat -> ctt)
        if: matrix.smoke
        env:
          MPICC: mpicc
          FI_PROVIDER: ${{ matrix.fi_provider || 'tcp' }} # libfabric (ch4:ofi): tcp works on a plain VM
          PSM2_DEVICES: self,shm  # MVAPICH2 ch3:psm without an Omni-Path HFI (other MPIs ignore it)
          PSM2_KASSIST_MODE: none # PSM2 shm: no cross-memory attach (CMA) - the runner forbids process_vm_readv between the
                                  # ranks, and PSM2 12.0.1 asserts instead of falling back when a CMA read fails
          MV2_USE_SHMEM_COLL: 0   # MVAPICH2: no shared-memory collectives (and their 2-level comms)
          MV2_ENABLE_AFFINITY: 0  # MVAPICH2: no CPU binding - on the runner VM its implicit mapping picks cores that do not
                                  # exist ("Core id 33 does not exist", MPI_Init fails); a single-node smoke test needs none
          SMOKE_ENGINEERING: ${{ matrix.patch && '1' || '0' }} # engineering build: MPI-internal functions must be traced
        run: |
          status=0
          for d in ${{ matrix.diags }}; do
            case $d in [Oo][Nn]) lib=mpi.tool/lib/gnu/libtractor_dbg.${{ matrix.target }}$ENG_SUFFIX.so ;;
                       *)        lib=mpi.tool/lib/gnu/libtractor.${{ matrix.target }}$ENG_SUFFIX.so ;; esac
            echo "::group::smoke DIAG=$d ($lib)"
            SMOKE_WORKDIR=$RUNNER_TEMP/smoke-diag-$d \
              mpi.tool/components/tractor/tests/ci/smoke.sh "$lib" 4 3 "${{ matrix.smoke_tests }}" || { status=1; echo "::error::smoke DIAG=$d failed"; }
            echo "::endgroup::"
            # experimental tests: run and reported, but a failure does not fail the job
            if [ -n "${{ matrix.smoke_experimental }}" ]; then
              echo "::group::smoke DIAG=$d experimental: ${{ matrix.smoke_experimental }}"
              SMOKE_WORKDIR=$RUNNER_TEMP/smoke-diag-$d-experimental \
                mpi.tool/components/tractor/tests/ci/smoke.sh "$lib" 4 3 "${{ matrix.smoke_experimental }}" \
                || echo "::warning::smoke DIAG=$d: experimental test(s) ${{ matrix.smoke_experimental }} failed"
              echo "::endgroup::"
            fi
          done
          exit $status
      - name: Upload smoke logs and traces
        if: always() && matrix.smoke
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.mpi }}
          path: ${{ runner.temp }}/smoke-diag-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: tractor-${{ matrix.mpi }}
          path: |
            mpi.tool/lib/gnu/
            mpi.tool/bin/gnu/

  # Qt trace viewer.
  qtv:
    name: qTV (Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build zlib1g-dev \
            qt6-base-dev qt6-svg-dev libgl-dev
      - name: Configure and build
        working-directory: mpi.tool/components/qTV
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/../../.."
          cmake --build build
          cmake --install build
