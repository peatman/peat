name: CI

on:
  push:
    branches: ["E&E"]
  pull_request:
    branches: ["E&E"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Serial analysis tools (no MPI): ctt, mat, pet, urpu via their CMake builds.
  # (mat MAT_TARGET=openmp is not functional yet, so it is not built.)
  tools:
    name: ctt + mat + pet + urpu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build zlib1g-dev
      - name: Build ctt
        run: |
          cmake -S mpi.tool/components/ctt/src -B build/ctt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ctt && cmake --install build/ctt
      - name: Build mat (serial)
        run: |
          cmake -S mpi.tool/components/mat/src -B build/mat -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial
          cmake --build build/mat && cmake --install build/mat
      - name: Build pet
        run: |
          cmake -S mpi.tool/components/pet/src -B build/pet -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pet && cmake --install build/pet
      - name: Build urpu (serial)
        run: |
          cmake -S mpi.tool/components/urpu/src -B build/urpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DURPU_TARGET=serial
          cmake --build build/urpu && cmake --install build/urpu
      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: mpi.tool/bin/

  # Trace collector via CMake against distro MPIs, then an end-to-end smoke test
  # (tests/ci/smoke.sh: func-classes tests under tractor -> mat -> ctt).
  tractor:
    name: tractor (${{ matrix.target }}, diag=${{ matrix.diag }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mpi_pkg: libmpich-dev mpich,         target: mpich4,  diag: "OFF", smoke_tests: "p2p coll comm rma" }
          - { mpi_pkg: libmpich-dev mpich,         target: mpich4,  diag: "ON",  smoke_tests: "p2p coll comm rma" }
          # Ubuntu 24.04 ships Open MPI 4.1; rma hangs under Open MPI even without tractor, so it is left out.
          - { mpi_pkg: libopenmpi-dev openmpi-bin, target: openmpi, diag: "OFF", smoke_tests: "p2p coll comm", experimental: true }
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gfortran cmake ninja-build perl libswitch-perl \
            zlib1g-dev libhwloc-dev libunwind-dev libomp-dev ${{ matrix.mpi_pkg }}
      - name: Provide omp-tools.h (OMPT=ON)
        # GCC's libgomp has no omp-tools.h; take only that header from LLVM's OpenMP so clang's other
        # headers (stddef.h, ...) don't end up on gcc's include path.
        run: |
          hdr=$(find /usr/lib/llvm-* /usr/include -name omp-tools.h 2>/dev/null | head -1)
          [ -n "$hdr" ] || { echo "omp-tools.h not found"; exit 1; }
          echo "using $hdr"
          mkdir -p "$RUNNER_TEMP/ompt" && cp "$hdr" "$RUNNER_TEMP/ompt/"
          echo "CPATH=$RUNNER_TEMP/ompt" >> "$GITHUB_ENV"
      - name: Build tractor
        run: |
          b=build/tractor
          cmake -S mpi.tool/components/tractor/src -B $b -G Ninja \
            -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx \
            -DTRACTOR_TARGET=${{ matrix.target }} -DDIAG=${{ matrix.diag }}
          cmake --build $b
          cmake --install $b
          ldd mpi.tool/lib/gnu/libtractor*.so
      - name: Build mat + ctt (for smoke test)
        run: |
          cmake -S mpi.tool/components/ctt/src -B build/ctt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ctt && cmake --install build/ctt
          cmake -S mpi.tool/components/mat/src -B build/mat -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build build/mat && cmake --install build/mat
      - name: Smoke test (tests under tractor -> mat -> ctt)
        env:
          MPICC: mpicc
          SMOKE_WORKDIR: ${{ runner.temp }}/smoke
        run: |
          lib=$(ls mpi.tool/lib/gnu/libtractor*.${{ matrix.target }}.so | head -1)
          mpi.tool/components/tractor/tests/ci/smoke.sh "$lib" 4 3 "${{ matrix.smoke_tests }}"
      - name: Upload smoke logs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}-diag-${{ matrix.diag }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tractor-${{ matrix.target }}-diag-${{ matrix.diag }}
          path: |
            mpi.tool/lib/gnu/
            mpi.tool/bin/gnu/

  # Qt trace viewer.
  qtv:
    name: qTV (Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build zlib1g-dev \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev libgl-dev
      - name: Configure and build
        working-directory: mpi.tool/components/qTV
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/../../.."
          cmake --build build
          cmake --install build
