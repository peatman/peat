name: CI

on:
  push:
    branches: ["E&E"]
  pull_request:
    branches: ["E&E"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Serial analysis tools (no MPI): ctt, mat, pet, urpu via their CMake builds.
  # (mat MAT_TARGET=openmp is not functional yet, so it is not built.)
  tools:
    name: ctt + mat + pet + urpu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build zlib1g-dev
      - name: Build ctt
        run: |
          cmake -S mpi.tool/components/ctt/src -B build/ctt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ctt && cmake --install build/ctt
      - name: Build mat (serial)
        run: |
          cmake -S mpi.tool/components/mat/src -B build/mat -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial
          cmake --build build/mat && cmake --install build/mat
      - name: Build pet
        run: |
          cmake -S mpi.tool/components/pet/src -B build/pet -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pet && cmake --install build/pet
      - name: Build urpu (serial)
        run: |
          cmake -S mpi.tool/components/urpu/src -B build/urpu -G Ninja -DCMAKE_BUILD_TYPE=Release -DURPU_TARGET=serial
          cmake --build build/urpu && cmake --install build/urpu
      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: mpi.tool/bin/

  # Trace collector via CMake, then an end-to-end smoke test (tests/ci/smoke.sh: func-classes tests
  # under tractor -> mat -> ctt).
  # Ubuntu 24.04's MPICH 4.2 is built --with-pmix, but its hydra mpiexec only serves PMI-1, so every
  # "mpiexec -n 4" starts 4 singletons: that MPICH is only build-tested (it is the MPI 4.1 non-const
  # prototype case). Smoke tests run on 22.04's MPICH 4.0 (plain PMI) and on MPICH built from source.
  tractor:
    name: tractor (${{ matrix.mpi }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, mpi: mpich-4.0,   mpi_pkg: libmpich-dev mpich, target: mpich4, diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-4.3.2, mpich_src: "4.3.2",           target: mpich4, diags: "OFF ON", smoke: true, smoke_tests: "p2p coll comm rma" }
          - { os: ubuntu-24.04, mpi: mpich-4.2,   mpi_pkg: libmpich-dev mpich, target: mpich4, diags: "OFF", smoke: false }
          # Ubuntu 24.04 ships Open MPI 4.1; rma hangs under Open MPI even without tractor, so it is left out.
          - { os: ubuntu-24.04, mpi: openmpi-4.1, mpi_pkg: libopenmpi-dev openmpi-bin, target: openmpi, diags: "OFF", smoke: true, smoke_tests: "p2p coll comm", experimental: true }
          # Open MPI 5 built from source (as tractor's Open MPI target expects); rma hangs under Open MPI 5
          # even without tractor, so it is left out.
          - { os: ubuntu-24.04, mpi: openmpi-5.0.10, ompi_src: "5.0.10", target: openmpi, diags: "OFF", smoke: true, smoke_tests: "p2p coll comm" }
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      MPICH_PREFIX: ${{ github.workspace }}/../mpich-${{ matrix.mpich_src }}
      OMPI_PREFIX: ${{ github.workspace }}/../openmpi-${{ matrix.ompi_src }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ gfortran cmake ninja-build perl libswitch-perl \
            zlib1g-dev libhwloc-dev libunwind-dev libomp-dev ${{ matrix.mpi_pkg }}
      - name: Cache MPICH ${{ matrix.mpich_src }}
        if: matrix.mpich_src
        id: mpich-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MPICH_PREFIX }}
          key: mpich-${{ matrix.mpich_src }}-ch4ofi-gnu-${{ matrix.os }}-v1
      - name: Build MPICH ${{ matrix.mpich_src }} from source
        if: matrix.mpich_src && steps.mpich-cache.outputs.cache-hit != 'true'
        # ch4:ofi with embedded libfabric as in scripts/mpich-<ver>/Build-ofi-m.sh, without Fortran/Lustre.
        # (ch3 has no partitioned communication and returns a wrong count for MPI_Isendrecv.)
        run: |
          v=${{ matrix.mpich_src }}
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o mpich.tar.gz "https://www.mpich.org/static/downloads/$v/mpich-$v.tar.gz"
          tar -xzf mpich.tar.gz && cd "mpich-$v"
          ./configure --prefix="$MPICH_PREFIX" --enable-silent-rules --enable-fast=O2 \
            --with-device=ch4:ofi --with-libfabric=embedded --with-pm=hydra --enable-romio --enable-threads=multiple \
            --enable-shared --disable-fortran --with-hwloc=embedded --without-ze --without-cuda \
            CC=gcc CXX=g++ > configure.log 2>&1 || { tail -n 50 configure.log; exit 1; }
          make -j"$(nproc)" > make.log 2>&1 || { tail -n 50 make.log; exit 1; }
          make install > install.log 2>&1
      - name: Use MPICH ${{ matrix.mpich_src }}
        if: matrix.mpich_src
        run: |
          echo "$MPICH_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$MPICH_PREFIX/lib" >> "$GITHUB_ENV"
      - name: Cache Open MPI ${{ matrix.ompi_src }}
        if: matrix.ompi_src
        id: ompi-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OMPI_PREFIX }}
          key: openmpi-${{ matrix.ompi_src }}-internal-gnu-${{ matrix.os }}-v1
      - name: Build Open MPI ${{ matrix.ompi_src }} from source
        if: matrix.ompi_src && steps.ompi-cache.outputs.cache-hit != 'true'
        # bundled hwloc/libevent/PMIx/PRRTE so nothing depends on the distro's Open MPI 4.1 packages; no Fortran
        run: |
          v=${{ matrix.ompi_src }}
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o openmpi.tar.bz2 "https://download.open-mpi.org/release/open-mpi/v${v%.*}/openmpi-$v.tar.bz2"
          tar -xjf openmpi.tar.bz2 && cd "openmpi-$v"
          ./configure --prefix="$OMPI_PREFIX" --enable-silent-rules --disable-mpi-fortran \
            --with-hwloc=internal --with-libevent=internal --with-pmix=internal --with-prrte=internal \
            CC=gcc CXX=g++ > configure.log 2>&1 || { tail -n 50 configure.log; exit 1; }
          make -j"$(nproc)" > make.log 2>&1 || { tail -n 50 make.log; exit 1; }
          make install > install.log 2>&1
      - name: Use Open MPI ${{ matrix.ompi_src }}
        if: matrix.ompi_src
        run: |
          echo "$OMPI_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$OMPI_PREFIX/lib" >> "$GITHUB_ENV"
      - name: Show MPI
        run: |
          which mpicc mpicxx mpiexec
          mpicxx -show
          mpiexec --version 2>/dev/null | head -5 || true
      - name: Provide omp-tools.h (OMPT=ON)
        # GCC's libgomp has no omp-tools.h; take only that header from LLVM's OpenMP so clang's other
        # headers (stddef.h, ...) don't end up on gcc's include path.
        run: |
          hdr=$(find /usr/lib/llvm-* /usr/include -name omp-tools.h 2>/dev/null | head -1)
          [ -n "$hdr" ] || { echo "omp-tools.h not found"; exit 1; }
          echo "using $hdr"
          mkdir -p "$RUNNER_TEMP/ompt" && cp "$hdr" "$RUNNER_TEMP/ompt/"
          echo "CPATH=$RUNNER_TEMP/ompt" >> "$GITHUB_ENV"
      - name: Build tractor (DIAG = ${{ matrix.diags }})
        # every DIAG variant in this one job: they share the deps install and the MPI build/cache
        run: |
          for d in ${{ matrix.diags }}; do
            b=build/tractor-$d
            cmake -S mpi.tool/components/tractor/src -B $b -G Ninja \
              -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx \
              -DTRACTOR_TARGET=${{ matrix.target }} -DDIAG=$d
            cmake --build $b
            cmake --install $b
          done
          ldd mpi.tool/lib/gnu/libtractor*.so
      - name: Build mat + ctt (for smoke test)
        if: matrix.smoke
        run: |
          cmake -S mpi.tool/components/ctt/src -B build/ctt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ctt && cmake --install build/ctt
          cmake -S mpi.tool/components/mat/src -B build/mat -G Ninja -DCMAKE_BUILD_TYPE=Release -DMAT_TARGET=serial \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build build/mat && cmake --install build/mat
      - name: Smoke test (tests under tractor -> mat -> ctt)
        if: matrix.smoke
        env:
          MPICC: mpicc
          FI_PROVIDER: tcp # libfabric (MPICH ch4:ofi): the provider that works on a plain VM
        run: |
          status=0
          for d in ${{ matrix.diags }}; do
            case $d in [Oo][Nn]) lib=mpi.tool/lib/gnu/libtractor_dbg.${{ matrix.target }}.so ;;
                       *)        lib=mpi.tool/lib/gnu/libtractor.${{ matrix.target }}.so ;; esac
            echo "::group::smoke DIAG=$d ($lib)"
            SMOKE_WORKDIR=$RUNNER_TEMP/smoke-diag-$d \
              mpi.tool/components/tractor/tests/ci/smoke.sh "$lib" 4 3 "${{ matrix.smoke_tests }}" || { status=1; echo "::error::smoke DIAG=$d failed"; }
            echo "::endgroup::"
          done
          exit $status
      - name: Upload smoke logs and traces
        if: always() && matrix.smoke
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.mpi }}
          path: ${{ runner.temp }}/smoke-diag-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: tractor-${{ matrix.mpi }}
          path: |
            mpi.tool/lib/gnu/
            mpi.tool/bin/gnu/

  # Qt trace viewer.
  qtv:
    name: qTV (Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ninja-build zlib1g-dev \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev libgl-dev
      - name: Configure and build
        working-directory: mpi.tool/components/qTV
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/../../.."
          cmake --build build
          cmake --install build
